version: 2

models:
  - name: mart_pouvoir_achat
    description: >
      Classement des communes d'Île-de-France selon leur pouvoir d'achat
      immobilier : nombre de m² qu'une année de revenu médian INSEE permet
      d'acheter au prix médian DVF. Communes avec au moins 20 ventes.

    columns:
      - name: departement
        tests:
          - not_null
      - name: code_commune
        description: Code INSEE (arrondissement pour Paris, Lyon, Marseille)
        tests:
          - not_null
      - name: commune
        description: Nom de la commune dans DVF
      - name: type_local
        description: Appartement ou Maison
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Appartement', 'Maison']
      - name: nb_ventes
        description: Nombre de ventes d'un logement unique retenues
      - name: prix_m2_median
        description: Prix médian au m² (base de l'indicateur)
        tests:
          - not_null
      - name: prix_m2_moyen
        description: Prix moyen au m², pour information
      - name: revenu_median
        description: Revenu médian annuel INSEE FiLoSoFi
        tests:
          - not_null
      - name: surface_achetable_m2
        description: revenu_median / prix_m2_median
        tests:
          - not_null
      - name: rang_surface_achetable_idf
        description: Rang en Île-de-France, par type de logement (1 = meilleur pouvoir d'achat)
      - name: rang_surface_achetable_departement
        description: Rang dans le département, par type de logement
